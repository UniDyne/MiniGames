<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rocket Match</title>
<meta name="theme-color" content="#0b1d4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rocket Match">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --ink: #263238; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
    color: #fff;
    background: linear-gradient(#0b1d4d 0%, #25479e 55%, #5b9bf0 100%);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #stars { position: fixed; inset: 0; pointer-events: none; }
  #stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: .7; animation: twinkle 3s infinite alternate; }
  @keyframes twinkle { to { opacity: .15; } }

  #app { position: relative; height: 100dvh; display: flex; flex-direction: column; padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: env(safe-area-inset-bottom); }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px 6px; }
  h1 { margin: 0; font-size: clamp(18px, 3.2vw, 28px); letter-spacing: .5px; text-shadow: 0 2px 0 rgba(0,0,0,.3); white-space: nowrap; }
  #hint { flex: 1; text-align: center; font-size: clamp(13px, 2.2vw, 20px); min-height: 1.4em; text-shadow: 0 1px 0 rgba(0,0,0,.3); }
  #hint.warn { color: #ffe082; }
  .right { display: flex; align-items: center; gap: 10px; white-space: nowrap; font-size: clamp(14px, 2.2vw, 20px); }
  button { font: inherit; cursor: pointer; }
  #sound { border: 0; border-radius: 12px; background: rgba(255,255,255,.2); color: #fff; font-size: 20px; padding: 4px 10px; }

  #board {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: clamp(6px, 1.2vw, 14px);
    width: min(calc(100% - 24px), 760px, 80vh);
    margin: 0 auto;
  }
  @media (max-width: 560px) {
    #board { grid-template-columns: repeat(4, 1fr); width: min(calc(100% - 24px), 50vh); }
  }
  .slot { aspect-ratio: 1; border-radius: 18px; background: rgba(255,255,255,.12); }
  .tile {
    width: 100%; height: 100%; padding: 10%;
    background: #fff; border-radius: 18px;
    box-shadow: 0 4px 0 rgba(0,0,0,.28);
    cursor: grab; touch-action: none;
  }
  .tile svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  .tile.pop { animation: pop .45s ease-out; }
  .tile.dragging { z-index: 100; cursor: grabbing; box-shadow: 0 14px 22px rgba(0,0,0,.35); transform: scale(1.04) rotate(-3deg); }
  .tile.shake { animation: nope .35s; }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes nope { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  #pads { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-end; gap: clamp(8px, 4vw, 48px); padding: 8px 12px 10px; }
  .pad { flex: 1; max-width: 240px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .rocketWrap { flex: 1; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: flex-end; transition: transform .15s, filter .15s; }
  .pad.hover .rocketWrap { transform: scale(1.06); filter: drop-shadow(0 0 16px #fff); }
  .ship { height: 100%; }
  .ship svg { height: 100%; width: auto; max-width: 100%; display: block; overflow: visible; }
  .ship.arrive { animation: arrive .9s ease-out; }
  .ship.shake { animation: rumble .12s infinite; }
  .ship.launch { animation: launch 1.5s cubic-bezier(.5,0,.9,.5) forwards; }
  .flame { opacity: 0; transform-origin: 100px 252px; }
  .ship.shake .flame { opacity: 1; transform: scale(.6); }
  .ship.launch .flame { opacity: 1; animation: flicker .1s infinite alternate; }
  @keyframes arrive { from { transform: translateY(70vh); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes rumble { 0%,100% { transform: translate(-2px, 0); } 50% { transform: translate(2px, 2px); } }
  @keyframes launch { 0% { transform: translateY(0); } 12% { transform: translateY(10px); } 100% { transform: translateY(-130vh); } }
  @keyframes flicker { from { transform: scaleY(1); } to { transform: scaleY(1.35); } }
  .win-icon { animation: pop .4s ease-out; transform-box: fill-box; transform-origin: center; }

  .padbase { width: 88%; height: 14px; border-radius: 8px; background: #455a64; box-shadow: 0 3px 0 rgba(0,0,0,.35); margin-top: -4px; }
  .label {
    margin-top: 6px; min-width: 40%; text-align: center; padding: 3px 14px; border-radius: 999px;
    background: #fff; color: var(--ink); font-weight: 700; font-size: clamp(14px, 2.4vw, 22px);
    border: 4px solid var(--c, #fff); min-height: 1.6em;
  }
  .label:empty { visibility: hidden; }

  .spark { position: fixed; width: 14px; height: 14px; pointer-events: none; z-index: 200; animation: spark 1s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) rotate(360deg) scale(.2); opacity: 0; } }

  #start { position: fixed; inset: 0; background: rgba(5,12,40,.82); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
  #start .card { background: #fff; color: var(--ink); border-radius: 28px; padding: 28px 32px; text-align: center; max-width: 440px; }
  #start h2 { margin: 0 0 8px; font-size: 34px; }
  #start p { font-size: 20px; margin: 8px 0 18px; }
  #play { border: 0; border-radius: 999px; background: #43a047; color: #fff; font-size: 28px; font-weight: 700; padding: 12px 40px; box-shadow: 0 5px 0 #2e7d32; }
  #play:active { transform: translateY(3px); box-shadow: 0 2px 0 #2e7d32; }
</style>
</head>
<body>
<div id="stars"></div>
<div id="app">
  <header>
    <h1>🚀 Rocket Match</h1>
    <div id="hint">Drag each picture to the rocket with the same color!</div>
    <div class="right"><span id="score">Launched: 0</span><button id="sound" aria-label="Toggle sound">🔊</button></div>
  </header>
  <section id="board"></section>
  <section id="pads"></section>
</div>
<div id="start">
  <div class="card">
    <h2>🚀 Rocket Match</h2>
    <p>Drag each picture to the rocket that is the <b>same color</b>.<br>Fill a rocket with 3 and it blasts off!</p>
    <button id="play">Play!</button>
  </div>
</div>

<script>
(() => {
'use strict';

// ---------- Data ----------
// Eight crayon-box colors. Every tile and every rocket uses exactly one of these.
const COLORS = [
  { name: 'Red',    hex: '#e53935' },
  { name: 'Orange', hex: '#fb8c00' },
  { name: 'Yellow', hex: '#fdd835' },
  { name: 'Green',  hex: '#43a047' },
  { name: 'Blue',   hex: '#1e88e5' },
  { name: 'Purple', hex: '#8e24aa' },
  { name: 'Pink',   hex: '#ff80ab' },
  { name: 'Brown',  hex: '#795548' },
];
const SLOTS = 12;
const PER_ROCKET = 3;
const MAX_PER_COLOR = 3;
const INK = '#263238';
const S = `stroke="${INK}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"`;

// Simple pictures drawn in a single dominant color (white/dark only for small details).
const SHAPES = {
  star:   c => `<polygon points="50,6 62,37 95,38 69,58 78,91 50,72 22,91 31,58 5,38 38,37" fill="${c}" ${S}/>`,
  heart:  c => `<path d="M50 90 C10 60 6 32 24 20 C38 11 48 20 50 30 C52 20 62 11 76 20 C94 32 90 60 50 90Z" fill="${c}" ${S}/>`,
  ball:   c => `<circle cx="50" cy="50" r="40" fill="${c}" ${S}/><path d="M24 38 Q30 24 44 20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>`,
  fish:   c => `<polygon points="68,50 94,28 94,72" fill="${c}" ${S}/><ellipse cx="42" cy="50" rx="34" ry="25" fill="${c}" ${S}/><circle cx="28" cy="44" r="6" fill="#fff"/><circle cx="27" cy="44" r="3" fill="${INK}"/>`,
  flower: c => [[50,26],[72.8,42.6],[64,69.4],[36,69.4],[27.2,42.6]].map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="16" fill="${c}" ${S}/>`).join('') + `<circle cx="50" cy="50" r="12" fill="#fff" ${S}/>`,
  house:  c => `<polygon points="50,10 92,46 8,46" fill="${c}" ${S}/><rect x="16" y="46" width="68" height="44" fill="${c}" ${S}/><rect x="42" y="62" width="16" height="28" fill="#fff" ${S}/>`,
  balloon:c => `<path d="M50 78 Q40 90 50 98" fill="none" stroke="${INK}" stroke-width="3"/><ellipse cx="50" cy="40" rx="28" ry="33" fill="${c}" ${S}/><polygon points="50,72 44,82 56,82" fill="${c}" ${S}/><path d="M34 28 Q38 18 48 14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>`,
  car:    c => `<path d="M26 46 L36 24 L66 24 L78 46Z" fill="${c}" ${S}/><rect x="8" y="44" width="84" height="28" rx="8" fill="${c}" ${S}/><polygon points="34,44 40,29 49,29 49,44" fill="#fff"/><polygon points="54,29 63,29 71,44 54,44" fill="#fff"/><circle cx="28" cy="74" r="11" fill="#37474f" ${S}/><circle cx="72" cy="74" r="11" fill="#37474f" ${S}/>`,
  moon:   c => `<path d="M62 8 A42 42 0 1 0 92 66 A34 34 0 1 1 62 8Z" fill="${c}" ${S}/>`,
  butterfly: c => `<ellipse cx="28" cy="36" rx="22" ry="18" fill="${c}" ${S}/><ellipse cx="72" cy="36" rx="22" ry="18" fill="${c}" ${S}/><ellipse cx="33" cy="68" rx="16" ry="14" fill="${c}" ${S}/><ellipse cx="67" cy="68" rx="16" ry="14" fill="${c}" ${S}/><rect x="45" y="24" width="10" height="56" rx="5" fill="${INK}"/><path d="M47 24 Q42 12 36 10 M53 24 Q58 12 64 10" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`,
};
const SHAPE_KEYS = Object.keys(SHAPES);
const iconSVG = (shape, colorIdx) => `<svg viewBox="0 0 100 100" aria-hidden="true">${SHAPES[shape](COLORS[colorIdx].hex)}</svg>`;

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(v * (1 + amt))));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(v => f(v).toString(16).padStart(2, '0')).join('');
}

const WINDOW_Y = [95, 148, 201];       // top → bottom
const FILL_ORDER = [2, 1, 0];          // load the bottom window first
function rocketSVG(hex) {
  const dark = shade(hex, -0.28);
  const rs = `stroke="${INK}" stroke-width="5" stroke-linejoin="round"`;
  const wins = WINDOW_Y.map((y, i) =>
    `<g class="win" data-i="${i}"><circle cx="100" cy="${y}" r="22" fill="#e3f2fd" stroke="${INK}" stroke-width="5"/></g>`).join('');
  return `<svg viewBox="0 0 200 330" aria-hidden="true">
    <g class="flame"><path d="M76 252 Q100 335 124 252Z" fill="#ff7043"/><path d="M87 252 Q100 305 113 252Z" fill="#ffee58"/></g>
    <path d="M48 180 L8 262 L62 240Z" fill="${dark}" ${rs}/>
    <path d="M152 180 L192 262 L138 240Z" fill="${dark}" ${rs}/>
    <path d="M100 15 C150 60 160 130 150 235 L50 235 C40 130 50 60 100 15Z" fill="${hex}" ${rs}/>
    <path d="M62 120 Q64 80 84 48" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".35"/>
    <path d="M72 235 L128 235 L118 258 L82 258Z" fill="#78909c" ${rs}/>
    ${wins}
  </svg>`;
}

// ---------- State ----------
const state = {
  tiles: Array(SLOTS).fill(null),   // {color, shape, el, busy}
  ships: [null, null, null],        // {color, loaded, busy, el, labelEl}
  score: 0,
  sound: true,
  lastLaunched: -1,
  refillTimer: null,
};
const $ = id => document.getElementById(id);
const boardEl = $('board'), padsEl = $('pads'), hintEl = $('hint');
const slotEls = [], padEls = [];
const rnd = n => Math.floor(Math.random() * n);

// ---------- Audio / speech ----------
let ac = null;
function ctx() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return ac; }
function tone(freq, dur, { type = 'sine', vol = 0.15, at = 0, to = null } = {}) {
  const a = ctx(); if (!a) return;
  const t = a.currentTime + at;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
function whoosh() {
  const a = ctx(); if (!a) return;
  const len = a.sampleRate * 1.6, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(200, a.currentTime); f.frequency.exponentialRampToValueAtTime(2500, a.currentTime + 1.5);
  const g = a.createGain(); g.gain.setValueAtTime(0.0, a.currentTime); g.gain.linearRampToValueAtTime(0.35, a.currentTime + 0.3); g.gain.linearRampToValueAtTime(0, a.currentTime + 1.6);
  src.connect(f).connect(g).connect(a.destination); src.start();
}
function sfx(kind) {
  if (!state.sound) return;
  if (kind === 'pick') tone(520, .08, { type: 'triangle', vol: .1 });
  else if (kind === 'ding') { tone(660, .15, { type: 'triangle' }); tone(990, .25, { type: 'triangle', at: .1 }); }
  else if (kind === 'nope') tone(220, .25, { type: 'sine', vol: .12, to: 150 });
  else if (kind === 'count') [0, .2, .4].forEach(t => tone(440, .1, { type: 'square', vol: .06, at: t }));
  else if (kind === 'whoosh') whoosh();
  else if (kind === 'arrive') tone(300, .4, { type: 'sine', vol: .1, to: 600 });
}
function speak(text) {
  if (!state.sound || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; u.pitch = 1.2;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- Hint line ----------
let hintTimer = null;
const DEFAULT_HINT = 'Drag each picture to the rocket with the same color!';
function say(text, warn) {
  hintEl.textContent = text; hintEl.classList.toggle('warn', !!warn);
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { hintEl.textContent = DEFAULT_HINT; hintEl.classList.remove('warn'); }, 3200);
}

// ---------- Board bookkeeping ----------
function colorCounts() {
  const c = Array(COLORS.length).fill(0);
  state.tiles.forEach(t => { if (t) c[t.color]++; });
  return c;
}
const activeShips = () => state.ships.filter(s => s && !s.busy);

function pickShipColor(avoid) {
  const used = state.ships.filter(Boolean).map(s => s.color);
  const cand = COLORS.map((_, i) => i).filter(i => !used.includes(i) && i !== avoid);
  const counts = colorCounts();
  const withTiles = cand.filter(i => counts[i] > 0);
  const pool = withTiles.length ? withTiles : cand;
  const weights = pool.map(i => 1 + counts[i]);
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let k = 0; k < pool.length; k++) { r -= weights[k]; if (r <= 0) return pool[k]; }
  return pool[0];
}

// ---------- Tiles ----------
function spawnTile(slot, color) {
  const shape = SHAPE_KEYS[rnd(SHAPE_KEYS.length)];
  const el = document.createElement('div');
  el.className = 'tile pop';
  el.innerHTML = iconSVG(shape, color);
  const tile = { color, shape, el, busy: false };
  state.tiles[slot] = tile;
  slotEls[slot].replaceChildren(el);
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('animationend', () => el.classList.remove('pop'));
}
// One refill step. No color may ever have more than MAX_PER_COLOR tiles on the board, and
// rocket colors are only spawned part of the time, so a full board can leave a rocket waiting
// for its color until the player clears space by filling another rocket. To avoid a dead end,
// when no waiting rocket has a matching tile on the board, the next tile spawned is one of theirs.
function refillStep() {
  const empty = state.tiles.map((t, i) => t ? -1 : i).filter(i => i >= 0);
  if (!empty.length) return false;
  const counts = colorCounts();
  const ships = activeShips();
  const isOpen = c => counts[c] < MAX_PER_COLOR;
  const shipColors = ships.map(s => s.color).filter(isOpen);
  const otherColors = COLORS.map((_, i) => i).filter(c => isOpen(c) && !ships.some(s => s.color === c));
  const anyPlayable = ships.some(s => counts[s.color] > 0);

  let pool;
  if (shipColors.length && !anyPlayable) pool = shipColors;
  else if (shipColors.length && (Math.random() < 0.4 || !otherColors.length)) pool = shipColors;
  else pool = otherColors.length ? otherColors : COLORS.map((_, i) => i).filter(isOpen);
  if (!pool.length) return false;
  spawnTile(empty[rnd(empty.length)], pool[rnd(pool.length)]);
  return true;
}
function scheduleRefill(delay = 280) {
  clearTimeout(state.refillTimer);
  state.refillTimer = setTimeout(() => { if (refillStep()) scheduleRefill(); }, delay);
}

// ---------- Rockets ----------
function spawnShip(i, avoid = -1) {
  const color = pickShipColor(avoid);
  const el = document.createElement('div');
  el.className = 'ship arrive';
  el.innerHTML = rocketSVG(COLORS[color].hex);
  el.addEventListener('animationend', e => { if (e.animationName === 'arrive') el.classList.remove('arrive'); });
  const pad = padEls[i];
  pad.querySelector('.rocketWrap').replaceChildren(el);
  const label = pad.querySelector('.label');
  label.textContent = COLORS[color].name;
  label.style.setProperty('--c', COLORS[color].hex);
  state.ships[i] = { color, loaded: 0, busy: false, el };
  sfx('arrive');
}

function launch(i) {
  const ship = state.ships[i];
  ship.busy = true;
  sfx('count');
  ship.el.classList.add('shake');
  setTimeout(() => {
    ship.el.classList.remove('shake');
    ship.el.classList.add('launch');
    sfx('whoosh'); speak('Blast off!');
    state.score++; $('score').textContent = 'Launched: ' + state.score;
    state.lastLaunched = ship.color;
    sparks(padEls[i]);
  }, 700);
  setTimeout(() => {
    ship.el.remove();
    padEls[i].querySelector('.label').textContent = '';
  }, 2300);
  setTimeout(() => {
    state.ships[i] = null;
    spawnShip(i, state.lastLaunched);
    scheduleRefill(150);
  }, 3300);
  }

function sparks(padEl) {
  const r = padEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.bottom - 40;
  for (let k = 0; k < 18; k++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = cx + 'px'; s.style.top = cy + 'px';
    s.style.background = COLORS[rnd(COLORS.length)].hex;
    s.style.borderRadius = k % 2 ? '50%' : '3px';
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 120;
    s.style.setProperty('--dx', Math.cos(a) * d + 'px');
    s.style.setProperty('--dy', Math.sin(a) * d - 40 + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}

// ---------- Dragging ----------
let drag = null;

function padAt(x, y) {
  for (let i = 0; i < padEls.length; i++) {
    const r = padEls[i].getBoundingClientRect(), m = 12;
    if (x >= r.left - m && x <= r.right + m && y >= r.top - m && y <= r.bottom + m) return i;
  }
  return -1;
}
function setHover(i) { padEls.forEach((p, k) => p.classList.toggle('hover', k === i)); }

function onDown(e) {
  if (drag || e.button > 0) return;
  const el = e.currentTarget;
  const slot = slotEls.indexOf(el.parentElement);
  const tile = state.tiles[slot];
  if (!tile || tile.busy) return;
  e.preventDefault();
  ctx(); // make sure audio is unlocked
  const r = el.getBoundingClientRect();
  drag = { el, slot, tile, dx: e.clientX - r.left, dy: e.clientY - r.top };
  tile.busy = true;
  el.classList.remove('pop');
  el.classList.add('dragging');
  el.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;padding:${r.width * 0.1}px;`;
  el.setPointerCapture(e.pointerId);
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onCancel);
  sfx('pick');
}
function onMove(e) {
  if (!drag) return;
  drag.el.style.left = e.clientX - drag.dx + 'px';
  drag.el.style.top = e.clientY - drag.dy + 'px';
  setHover(padAt(e.clientX, e.clientY));
}
function endListeners(el) {
  el.removeEventListener('pointermove', onMove);
  el.removeEventListener('pointerup', onUp);
  el.removeEventListener('pointercancel', onCancel);
}
function onCancel() {
  if (!drag) return;
  const d = drag; drag = null; endListeners(d.el); setHover(-1);
  goHome(d, false);
}
function onUp(e) {
  if (!drag) return;
  const d = drag; drag = null; endListeners(d.el);
  const i = padAt(e.clientX, e.clientY);
  setHover(-1);
  const ship = i >= 0 ? state.ships[i] : null;
  if (ship && !ship.busy && ship.loaded < PER_ROCKET && ship.color === d.tile.color) {
    accept(d, i);
  } else {
    goHome(d, i >= 0);
    if (i >= 0) wrongMessage(d.tile.color);
  }
}

function wrongMessage(color) {
  const name = COLORS[color].name;
  const has = activeShips().some(s => s.color === color);
  say(has ? `That one is ${name}. Find the ${name} rocket!` : `That one is ${name}. There is no ${name} rocket right now.`, true);
  speak(name);
  sfx('nope');
}

function goHome(d, shake) {
  const r = slotEls[d.slot].getBoundingClientRect();
  const el = d.el;
  el.style.transition = 'left .25s ease, top .25s ease';
  el.style.left = r.left + 'px'; el.style.top = r.top + 'px';
  setTimeout(() => {
    el.style.cssText = '';
    el.classList.remove('dragging');
    if (shake) { el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400); }
    d.tile.busy = false;
  }, 260);
}

function accept(d, i) {
  const ship = state.ships[i];
  const winIdx = FILL_ORDER[ship.loaded];
  ship.loaded++;
  state.tiles[d.slot] = null;
  const full = ship.loaded >= PER_ROCKET;
  if (full) ship.busy = true; // reserve so nothing else can be dropped on it

  const win = ship.el.querySelector(`.win[data-i="${winIdx}"]`);
  const wr = win.getBoundingClientRect();
  const el = d.el, size = wr.width * 0.85;
  el.style.transition = 'left .3s ease, top .3s ease, width .3s ease, height .3s ease, opacity .3s ease, transform .3s ease, padding .3s ease';
  el.style.left = wr.left + (wr.width - size) / 2 + 'px';
  el.style.top = wr.top + (wr.height - size) / 2 + 'px';
  el.style.width = size + 'px'; el.style.height = size + 'px'; el.style.padding = size * 0.1 + 'px';
  el.style.transform = 'none'; el.style.opacity = '.9';
  sfx('ding'); speak(COLORS[ship.color].name + '!');
  scheduleRefill(350);

  setTimeout(() => {
    el.remove();
    const y = WINDOW_Y[winIdx];
    win.insertAdjacentHTML('beforeend',
      `<svg class="win-icon" x="80" y="${y - 20}" width="40" height="40" viewBox="0 0 100 100">${SHAPES[d.tile.shape](COLORS[ship.color].hex)}</svg>`);
    if (full) { ship.busy = false; launch(i); }
  }, 320);
}

// ---------- Setup ----------
function init() {
  const stars = $('stars');
  for (let i = 0; i < 50; i++) {
    const s = document.createElement('i');
    s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 70 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    stars.appendChild(s);
  }
  for (let i = 0; i < SLOTS; i++) {
    const s = document.createElement('div'); s.className = 'slot'; boardEl.appendChild(s); slotEls.push(s);
  }
  for (let i = 0; i < 3; i++) {
    const p = document.createElement('div'); p.className = 'pad';
    p.innerHTML = '<div class="rocketWrap"></div><div class="padbase"></div><div class="label"></div>';
    padsEl.appendChild(p); padEls.push(p);
  }
  for (let i = 0; i < 3; i++) spawnShip(i);
  for (let n = 0; n < SLOTS * 2 && refillStep(); n++) { /* fill the board */ }

  $('sound').addEventListener('click', e => {
    state.sound = !state.sound;
    e.currentTarget.textContent = state.sound ? '🔊' : '🔇';
    if (!state.sound && 'speechSynthesis' in window) speechSynthesis.cancel();
  });
  $('play').addEventListener('click', () => { ctx(); $('start').remove(); sfx('ding'); });
}
init();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
