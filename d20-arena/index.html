<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D20 Arena</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1d2029;
    --line: #2c3140;
    --text: #d7dae2;
    --dim: #8a90a0;
    --accent: #c9a227;
    --hp: #3f9d5a;
    --hp-low: #b0413e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, sans-serif;
  }
  header {
    display: flex;
    gap: 16px;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 18px; margin: 0; color: var(--accent); letter-spacing: 1px; }
  header .chip {
    background: var(--line);
    border-radius: 4px;
    padding: 2px 10px;
    font-size: 13px;
  }
  #phase { color: var(--accent); }
  main {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 12px;
    padding: 12px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
  }
  .card-name { font-weight: 600; margin-bottom: 6px; }
  .bar {
    position: relative;
    height: 20px;
    background: #0e1015;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .bar .fill { height: 100%; background: var(--hp); transition: width .2s; }
  .bar .fill.low { background: var(--hp-low); }
  .bar span {
    position: absolute;
    inset: 0;
    text-align: center;
    font-size: 12px;
    line-height: 20px;
  }
  .stats, .gear {
    display: flex;
    gap: 12px;
    font-size: 13px;
    color: var(--dim);
    margin-top: 4px;
  }
  .vs { text-align: center; color: var(--dim); font-size: 13px; margin: 4px 0; }
  #actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button {
    background: var(--line);
    color: var(--text);
    border: 1px solid #3a4155;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #353c4f; }
  button:disabled { opacity: .4; cursor: default; }
  #log {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    height: 70vh;
    overflow-y: auto;
    padding: 10px;
    font-size: 13px;
  }
  #log .line { padding: 2px 0; border-bottom: 1px solid #232735; color: var(--dim); }
  #log .line b { color: var(--text); }
  #shop { margin-top: 12px; }
  #shop h3 { margin: 12px 0 6px; color: var(--accent); }
  .grid { display: grid; gap: 6px; }
  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .item.equipped { border-color: var(--accent); }
  .item-desc { font-size: 12px; color: var(--dim); }
  .shop-row { display: flex; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <h1>D20 ARENA</h1>
  <span class="chip" id="level">—</span>
  <span class="chip" id="gold">—</span>
  <span class="chip" id="phase">IDLE</span>
</header>
<main>
  <section>
    <div id="arena"></div>
    <div id="actions"></div>
    <div id="shop"></div>
  </section>
  <aside id="log"></aside>
</main>
<script type="module" src="./ui.js"></script>
</body>
</html>
